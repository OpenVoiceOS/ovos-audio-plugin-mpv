name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_plugin_mpv'
      test_path: 'test/'
      install_extras: '.[test]'
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 releases: pull the
      # media-backend-v2 template ahead of the wheel's v1-floored dependency.
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2'
      min_coverage: 0
